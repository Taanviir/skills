<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="graphite-ui/tokens.css">
<link rel="stylesheet" href="graphite-ui/base.css">
<link rel="stylesheet" href="graphite-ui/bootstrap.css">
<link rel="stylesheet" href="custom.css">
<script src="graphite-ui/press.js"></script>
</head>
<body>
<nav class="navbar navbar-expand">
  <span class="navbar-brand">Clinic Rota</span>
  <button class="btn btn-outline-light btn-sm ms-auto" id="theme">Toggle theme</button>
</nav>
<div class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="me-auto">This week's shifts</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add">Add shift</button>
  </div>
  <div class="alert alert-danger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <p>Two night shifts have no nurse assigned.</p>
  </div>
  <div class="row g-3 mb-4">
    <div class="col"><div class="card kpi"><div class="card-body"><div class="text-muted small">Shifts</div><div class="kpi-value">64</div></div></div></div>
    <div class="col"><div class="card kpi"><div class="card-body"><div class="text-muted small">Unfilled</div><div class="kpi-value text-danger">2</div></div></div></div>
  </div>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Day</th><th>Shift</th><th>Nurse</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Mon</td><td>Night</td><td>R. Haddad</td><td><span class="status success">Confirmed</span></td></tr>
        <tr><td>Tue</td><td>Night</td><td>Unassigned</td><td><span class="status danger">Open</span></td></tr>
        <tr><td>Wed</td><td>Day</td><td>L. Okonkwo</td><td><span class="status warning">Swap asked</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal fade" id="add" tabindex="-1" aria-labelledby="add-title">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="add-title">Add shift</h2>
      <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <label class="form-label" for="day">Day</label>
      <select class="form-select" id="day"><option>Mon</option><option>Tue</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Save shift</button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('theme').addEventListener('click', () => {
  const html = document.documentElement;
  const dark = html.dataset.theme
    ? html.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  html.dataset.theme = dark ? 'light' : 'dark';
});
</script>
</body>
</html>
