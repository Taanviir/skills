<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbank Libraries 2025, in 7 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Library catalogue card and date-due slip: ruled index-card ground, call-number strip, violet date-stamp ink. */
:root {
  --paper: #F7F5EE;
  --ink: #1E3A2F;
  --muted: #5C6B62;
  --rule: #C9D3DC;
  --accent: #6A3FA8;
  --accent-ink: #FFFFFF;
  --redline: #C8504A;
  --page: #2A3B33;
  --page-fg: #EEF0EA;
  --display: "Zilla Slab", Georgia, serif;
  --body: "Libre Franklin", system-ui, sans-serif;
  --mono: "Courier Prime", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

/* ---------- card shell ---------- */
.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  color: var(--ink); font-family: var(--body);
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 53px, var(--rule) 53px 54px);
  background-position: 0 30px; }
.card-top { height: 64px; flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: 0 80px; background: var(--paper); border-bottom: 3px solid var(--redline);
  font: 700 22px var(--mono); letter-spacing: .1em; color: var(--ink); }
.card-top .due { color: var(--accent); border: 2px solid var(--accent); padding: 2px 12px; transform: rotate(-2deg); }
.card-body { flex: 1; min-height: 0; padding: 64px 80px 56px; display: flex; flex-direction: column; gap: 44px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px; background: var(--paper);
  border-top: 2px solid var(--ink); font: 400 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
.card-foot b { color: var(--ink); font-weight: 700; }
.spacer { flex: 1; }

.eyebrow { font: 700 24px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 700 88px/1.0 var(--display); letter-spacing: -0.015em; margin: -16px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.tag { font: 700 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* stats, styled as a date-due slip grid */
.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 8px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 700 112px/1 var(--display); letter-spacing: -0.02em; }
.stat:nth-child(2) .n, .stat:nth-child(3) .n { color: var(--accent); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); background: var(--paper); }
.tl li { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 700 28px/1.4 var(--mono); color: var(--accent); }
.tl .t { font-size: 32px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 30px; }
.pts li { font-size: 34px; line-height: 1.4; padding-left: 44px; position: relative; text-wrap: pretty; }
.pts li::before { content: ""; position: absolute; left: 0; top: 15px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }

.quote { font: 500 54px/1.15 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 400 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 34px 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 700 64px/1.0 var(--display); }
.compare .accent h3 { color: var(--accent); }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }

.bars { display: flex; align-items: end; gap: 20px; height: 320px; flex: none; border-bottom: 2px solid var(--ink); }
.bars div { flex: 1; background: var(--ink); color: var(--paper); padding: 16px 22px; font: 700 26px/1.3 var(--mono); display: flex; flex-direction: column; justify-content: end; }
.bars div b { font: 700 64px/1 var(--display); }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }

/* horizontal share bars */
.split { display: flex; flex-direction: column; gap: 26px; }
.split .row { display: flex; flex-direction: column; gap: 10px; }
.split .lab { display: flex; justify-content: space-between; font: 700 26px var(--mono); }
.split .track { height: 56px; background: var(--paper); border: 2px solid var(--ink); }
.split .fill { height: 100%; background: var(--ink); }
.split .row.hi .fill { background: var(--accent); }
.split .row.hi .lab { color: var(--accent); }

/* ledger table for the money card */
.ledger { border-top: 2px solid var(--ink); background: var(--paper); }
.ledger div { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--rule); font-size: 32px; }
.ledger div span:last-child { font: 700 32px var(--mono); }
.ledger div.total { border-bottom: 2px solid var(--ink); font-weight: 600; }
.ledger div.total span:last-child { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Northbank Libraries 2025, in 7 cards</h1>
      <p>From the Northbank Libraries Annual Report 2025 (published February 2026). Seven cards.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>027.4 NOR · ANNUAL REPORT 2025</span><span class="due">NO FINES</span></div>
      <div class="card-body">
        <div class="eyebrow">Northbank Libraries · 7 branches</div>
        <h2>A library dropped fines, <em>stayed open late</em> and lent out drills</h2>
        <p class="lede">Then it had its busiest year since 1998.</p>
        <div class="stats">
          <div class="stat"><span class="n">1.42M</span><span class="l">visits in 2025</span></div>
          <div class="stat"><span class="n">+18%</span><span class="l">visits on 2024</span></div>
          <div class="stat"><span class="n">9 pm</span><span class="l">weekday closing, was 6 pm</span></div>
          <div class="stat"><span class="n">640</span><span class="l">things to borrow besides books</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>01 / 07</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-late-nights">
      <div class="card-top"><span>027.4 NOR · OPENING HOURS</span><span class="due">OPEN TILL 9</span></div>
      <div class="card-body">
        <div class="eyebrow">Opening hours</div>
        <h2>Open till 9 pm, and <em>people came</em></h2>
        <p class="lede">From April, all seven branches stayed open three extra hours on weekdays.</p>
        <div>
          <div class="tag" style="margin-bottom:16px">Evening share of all visits</div>
          <div class="bars">
            <div style="height:37.5%"><b>9%</b>before</div>
            <div style="height:100%"><b>24%</b>after</div>
          </div>
        </div>
        <ul class="pts">
          <li><b>Who staffs it.</b> 22 people moved from back-office cataloguing, now shared with the county, to the front desk.</li>
          <li><b>What it costs.</b> $310,000 a year in extra building and security costs.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>02 / 07</b></div>
    </article></div><figcaption><span>02 · Late nights</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-no-fines">
      <div class="card-top"><span>027.4 NOR · FINES</span><span class="due">FINE: $0.00</span></div>
      <div class="card-body">
        <div class="eyebrow">Fines</div>
        <h2>No more late fines. <em>Here's the trade.</em></h2>
        <p class="lede">Northbank stopped charging late fines on 1 January 2025.</p>
        <div class="compare">
          <div><span class="tag">What it cost</span><h3>$86,000</h3><p>in fines income, based on 2024. Loans now come back 2.1 days later on average.</p></div>
          <div class="accent"><span class="tag">What came back</span><h3>3,900</h3><p>people whose accounts were blocked by fines borrowed again. Lost-item losses fell 11%.</p></div>
        </div>
        <p class="quote">People were no longer afraid to return overdue books.</p>
        <div class="who">Northbank Libraries Annual Report 2025</div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>03 / 07</b></div>
    </article></div><figcaption><span>03 · No fines</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-library-of-things">
      <div class="card-top"><span>027.4 NOR · LIBRARY OF THINGS</span><span class="due">640 ITEMS</span></div>
      <div class="card-body">
        <div class="eyebrow">Library of things</div>
        <h2>Borrow a <em>power drill</em>, not just a book</h2>
        <p class="lede">640 items, including sewing machines, telescopes, power drills and laptops.</p>
        <ol class="tl">
          <li><span class="d">March</span><span class="t">Started at two branches.</span></li>
          <li><span class="d">September</span><span class="t">In all seven branches.</span></li>
          <li><span class="d">2025</span><span class="t">Borrowed 12,700 times.</span></li>
          <li><span class="d">2026</span><span class="t">200 more items, chosen by member vote.</span></li>
        </ol>
        <div class="compare one"><div><span class="tag">Most borrowed</span><h3>1. Laptops<br>2. <em style="font-style:normal;color:var(--accent)">The carpet cleaner</em></h3></div></div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>04 / 07</b></div>
    </article></div><figcaption><span>04 · Library of things</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-ebooks">
      <div class="card-top"><span>027.4 NOR · DIGITAL LENDING</span><span class="due">LICENCE EXPIRES</span></div>
      <div class="card-body">
        <div class="eyebrow">Digital lending</div>
        <h2>E-books are the <em>expensive shelf</em></h2>
        <p class="lede">E-book and audiobook loans hit 410,000, up 31%. Licences cost $1.9 million.</p>
        <div class="split">
          <div class="row hi"><div class="lab"><span>Share of collection budget</span><span>34%</span></div><div class="track"><div class="fill" style="width:34%"></div></div></div>
          <div class="row"><div class="lab"><span>Share of loans</span><span>22%</span></div><div class="track"><div class="fill" style="width:22%"></div></div></div>
        </div>
        <ul class="pts">
          <li><b>Markup.</b> Publishers charge libraries several times the consumer price for an e-book licence.</li>
          <li><b>Expiry.</b> Many licences run out after two years.</li>
          <li><b>Next.</b> Northbank is lobbying the state for a fair-pricing law.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>05 / 07</b></div>
    </article></div><figcaption><span>05 · E-books</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="06-fell-short">
      <div class="card-top"><span>027.4 NOR · WHERE WE FELL SHORT</span><span class="due">OVERDUE</span></div>
      <div class="card-body">
        <div class="eyebrow">Where it fell short</div>
        <h2>Not everything <em>arrived on time</em></h2>
        <p class="quote">I want to explain what changed, what it cost, and where we fell short.</p>
        <div class="who">Priya Raman, director</div>
        <ul class="pts">
          <li><b>Eastgate roof.</b> The repair ran five months late and closed the branch for 14 weeks in summer.</li>
          <li><b>Summer reading.</b> It reached 5,200 children against a target of 6,500, mostly because of the Eastgate closure.</li>
          <li><b>Mobile library van.</b> It's ordered but won't arrive until mid-2026.</li>
        </ul>
        <div class="split">
          <div class="row hi"><div class="lab"><span>Summer reading: children reached</span><span>5,200</span></div><div class="track"><div class="fill" style="width:80%"></div></div></div>
          <div class="row"><div class="lab"><span>Target</span><span>6,500</span></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>06 / 07</b></div>
    </article></div><figcaption><span>06 · Fell short</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="07-money-and-2026">
      <div class="card-top"><span>027.4 NOR · MONEY &amp; 2026</span><span class="due">RENEWED</span></div>
      <div class="card-body">
        <div class="eyebrow">Money and what's next</div>
        <h2>More visits, <em>less per visit</em></h2>
        <p class="lede">The budget grew 4%. Visits grew 18%.</p>
        <div class="compare">
          <div><span class="tag">Cost per visit, 2024</span><h3>$11.80</h3></div>
          <div class="accent"><span class="tag">Cost per visit, 2025</span><h3>$10.30</h3></div>
        </div>
        <div class="ledger">
          <div><span>Staff</span><span>$7.1M</span></div>
          <div><span>Collections</span><span>$5.6M</span></div>
          <div><span>Buildings and evening hours</span><span>$1.9M</span></div>
          <div class="total"><span>Total budget, up 4%</span><span>$14.6M</span></div>
        </div>
        <ul class="pts">
          <li><b>Sundays.</b> Afternoon opening at three branches in 2026.</li>
          <li><b>The van.</b> It starts in the rural north once it arrives.</li>
          <li><b>More things.</b> 200 new items, chosen by member vote.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>07 / 07</b></div>
    </article></div><figcaption><span>07 · Money and 2026</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
