<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbank Libraries 2025, in 4 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin="anonymous" lets the PNG export read the font CSS. Keep it when swapping families. -->
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;800&family=Libre+Franklin:wght@400;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Library catalogue card: manila ruled index-card ground, a "date due" stamp strip on top, call number as the page counter. */
:root {
  --paper: #EFE6CC;      /* card ground */
  --ink: #1F2A3A;        /* text, rules, dark blocks */
  --muted: #5A6170;      /* secondary text */
  --rule: #B9C3CF;       /* hairlines */
  --accent: #5B3E9E;     /* date-due stamp violet */
  --accent-ink: #FFFFFF; /* text on accent */
  --page: #3B2F25;       /* wooden catalogue drawer */
  --page-fg: #F1E9D6;
  --display: "Roboto Slab", Georgia, serif;
  --body: "Libre Franklin", system-ui, sans-serif;
  --mono: "Courier Prime", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

/* ---------- gallery page, the collage view ---------- */
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

/* ---------- card shell, 1080x1350, sizes in px at full scale ---------- */
.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  color: var(--ink); font-family: var(--body);
  background:
    linear-gradient(90deg, transparent 54px, rgb(176 58 58 / .35) 54px 56px, transparent 56px),
    repeating-linear-gradient(180deg, transparent 0 63px, rgb(90 120 160 / .16) 63px 65px),
    var(--paper); }
.card-top { height: 64px; flex: none; background: var(--ink); color: var(--paper);
  display: flex; align-items: center; gap: 22px; padding: 0 80px; font: 700 21px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.card-top .due { border: 2px solid currentColor; padding: 3px 12px; color: #C9B8F0; transform: rotate(-2deg); }
.card-top .call { margin-left: auto; opacity: .75; }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px;
  border-top: 2px solid var(--ink); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; background: var(--paper); }
.card-foot b { color: var(--ink); font-weight: 700; }
.spacer { flex: 1; }

.eyebrow { font: 700 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 84px/0.98 var(--display); letter-spacing: -0.025em; margin: -20px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.chip { font: 700 0.8em var(--mono); padding: 2px 10px; border-radius: 4px; white-space: nowrap; background: var(--ink); color: var(--paper); }
.tag { font: 700 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* ---------- components ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: rgb(255 255 255 / .35); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 800 108px/1 var(--display); letter-spacing: -0.03em; }
.stat:first-child .n { color: var(--accent); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.tl .d { font: 700 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px; }
.pts li { font-size: 34px; line-height: 1.38; padding-left: 44px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }

/* compare restyled as two stamped loan slips */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 34px 36px; display: flex; flex-direction: column; gap: 12px; border: 2px dashed var(--ink); background: rgb(255 255 255 / .4); }
.compare > div.hit { border: 3px solid var(--accent); }
.compare h3 { margin: 0; font: 800 64px/1 var(--display); letter-spacing: -0.02em; }
.compare > div.hit h3 { color: var(--accent); }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }

/* evening share: two stamped bars on a ruled scale */
.bars { display: flex; align-items: end; gap: 40px; height: 380px; flex: none; border-bottom: 3px solid var(--ink); padding: 0 40px; }
.bars div { flex: 1; background: var(--ink); color: var(--paper); padding: 20px 24px; font: 700 26px/1.3 var(--mono);
  display: flex; flex-direction: column; justify-content: start; gap: 6px; }
.bars div strong { font: 800 80px/1 var(--display); }
.cover h2 { font-size: 100px; }
.cover .stat { padding: 50px 40px; }
.cover .stat .n { font-size: 124px; }
.fines .compare h3 { font-size: 72px; white-space: nowrap; }
.fines .compare > div { padding: 44px 40px; gap: 18px; }
.fines .compare p { font-size: 32px; }
.things h2 { font-size: 96px; }
.things .tl .t { font-size: 35px; }
.things .tl li { padding: 30px 0; }
.things .compare p { font-size: 32px; }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Northbank Libraries 2025, in 4 cards</h1>
      <p>Four cards from the Northbank Libraries Annual Report 2025 (published February 2026).</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card cover" data-name="01-cover">
      <div class="card-top"><span class="due">Date due</span><span>Annual report 2025</span><span class="call">027.4 NOR</span></div>
      <div class="card-body">
        <div class="eyebrow">Northbank Libraries · 7 branches</div>
        <h2>The library had its <em>busiest year</em> since 1998</h2>
        <p class="lede">It stayed open later, stopped charging fines and started lending more than books. People came back.</p>
        <div class="stats">
          <div class="stat"><span class="n">1.42M</span><span class="l">visits in 2025</span></div>
          <div class="stat"><span class="n">+18%</span><span class="l">visits on 2024</span></div>
          <div class="stat"><span class="n">$10.30</span><span class="l">cost per visit, down from $11.80</span></div>
          <div class="stat"><span class="n">3,900</span><span class="l">blocked members back after fines ended</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>01 / 04</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-evening-hours">
      <div class="card-top"><span class="due">Date due</span><span>Opening hours</span><span class="call">027.4 NOR</span></div>
      <div class="card-body">
        <div class="eyebrow">From April 2025</div>
        <h2>Open until <em>9&nbsp;pm</em>, not 6&nbsp;pm</h2>
        <p class="lede">All seven branches stayed open three hours later on weekdays. To pay for it, 22 staff moved from cataloguing to the front desk.</p>
        <div class="bars">
          <div style="height:37.5%"><strong>9%</strong>before</div>
          <div style="height:100%"><strong>24%</strong>after</div>
        </div>
        <p class="small">Share of all visits made in the evening. Extra building and security cost: $310,000 a year.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>02 / 04</b></div>
    </article></div><figcaption><span>02 · Evening hours</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card fines" data-name="03-no-fines">
      <div class="card-top"><span class="due">Date due</span><span>Fines</span><span class="call">027.4 NOR</span></div>
      <div class="card-body">
        <div class="eyebrow">Since 1 January 2025</div>
        <h2>No more <em>late fines</em></h2>
        <p class="lede">The library expected some books to come back later. Here is what actually changed.</p>
        <div class="compare">
          <div><span class="tag">The cost</span><h3>+2.1&nbsp;days</h3><p>The average loan now comes back a little later.</p></div>
          <div class="hit"><span class="tag">The gain</span><h3>3,900</h3><p>People whose accounts were blocked came back and borrowed again.</p></div>
        </div>
        <ul class="pts">
          <li><b>Money given up.</b> Fines brought in $86,000 in 2024.</li>
          <li><b>Fewer lost books.</b> Lost-item losses fell 11%, because people were no longer afraid to return overdue books.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>03 / 04</b></div>
    </article></div><figcaption><span>03 · No fines</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card things" data-name="04-things-and-misses">
      <div class="card-top"><span class="due">Date due</span><span>Library of things</span><span class="call">027.4 NOR</span></div>
      <div class="card-body">
        <div class="eyebrow">Borrow a drill, not only a book</div>
        <h2>Laptops beat the <em>carpet cleaner</em></h2>
        <ol class="tl">
          <li><span class="d">Mar 2025</span><span class="t">The library of things starts at two branches.</span></li>
          <li><span class="d">Sep 2025</span><span class="t">All seven branches lend 640 items, from sewing machines to telescopes.</span></li>
          <li><span class="d">2025 total</span><span class="t">12,700 loans. Laptops came first, the carpet cleaner second.</span></li>
        </ol>
        <div class="compare one">
          <div><span class="tag">Where it fell short</span><p>The Eastgate roof repair ran five months late and shut the branch for 14 summer weeks. Summer reading reached 5,200 children, short of the 6,500 target.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>04 / 04</b></div>
    </article></div><figcaption><span>04 · Library of things</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
