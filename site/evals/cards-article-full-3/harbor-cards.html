<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Calloway's rebuilt harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Nautical chart and quay signage: chart-paper graticule ground, a berth-marker strip on top, depth soundings as a hanging gauge. */
:root {
  --paper: #E9F0EF;
  --ink: #0E2A3B;
  --muted: #4A6372;
  --rule: #B9CBCC;
  --accent: #E0501F;
  --accent-ink: #FFFFFF;
  --page: #0B2130;
  --page-fg: #E3ECEE;
  --display: "Big Shoulders Display", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.4rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--paper); color: var(--ink); font-family: var(--body);
  background-image:
    linear-gradient(rgb(14 42 59 / .055) 1px, transparent 1px),
    linear-gradient(90deg, rgb(14 42 59 / .055) 1px, transparent 1px);
  background-size: 90px 90px; background-position: -1px -1px; }
.card-top { height: 56px; flex: none; background: var(--ink); color: var(--paper); display: flex; align-items: center;
  justify-content: space-between; padding: 0 0 0 80px; font: 500 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.card-top i { font-style: normal; align-self: stretch; width: 260px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 22px, var(--paper) 22px 44px); }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px;
  border-top: 2px solid var(--ink); background: var(--paper); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
.card-foot b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }

.eyebrow { font: 500 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 104px/0.94 var(--display); letter-spacing: -0.01em; margin: -20px 0 0; text-wrap: balance; text-transform: uppercase; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 38px; line-height: 1.4; margin: 0; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.tag { font: 500 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 800 132px/1 var(--display); letter-spacing: -0.01em; }
.stat:first-child .n { color: var(--accent); }
.stat .l { font-size: 30px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 230px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 500 27px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 36px; line-height: 1.38; }

.quote { font: 500 76px/1.02 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 500 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 800 54px/1 var(--display); text-transform: uppercase; }
.compare p { margin: 0; font-size: 30px; line-height: 1.38; }
.compare .hi { background: var(--ink); color: var(--paper); }
.compare .hi .tag { color: var(--rule); }
.compare .hi h3 { color: var(--accent); }

.bars { display: flex; align-items: end; gap: 18px; height: 420px; flex: none; }
.bars div { flex: 1; background: var(--ink); color: var(--paper); padding: 20px 22px; font: 500 24px/1.3 var(--mono);
  display: flex; flex-direction: column; justify-content: end; gap: 4px; }
.bars div b { font: 800 72px/1 var(--display); }
.bars div.acc { background: var(--accent); color: var(--accent-ink); }

/* depth gauge: berths hang below a waterline, length scaled to draft */
.gauge { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; flex: none; }
.gauge .col { display: flex; flex-direction: column; gap: 14px; }
.gauge .wl { border-top: 4px solid var(--ink); padding-top: 10px; font: 500 22px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.gauge .berths { display: flex; gap: 12px; align-items: start; height: 430px; }
.gauge .berths span { flex: 1; background: var(--ink); }
.gauge .new .berths span { background: var(--accent); }
.gauge .d { font: 800 92px/1 var(--display); }
.gauge .d small { font: 500 26px var(--mono); color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Port Calloway's rebuilt harbor</h1>
      <p>Six cards from the Calloway Ledger, 6 March 2026, by Mira Okafor.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>Port Calloway · Harbor</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">Reopened 4 March 2026</div>
        <h2>Port Calloway's harbor is <em>open again</em></h2>
        <p class="lede">Cargo ships are back after a full rebuild. It took longer than a year and a half, and it still came in under budget.</p>
        <div class="stats">
          <div class="stat"><span class="n">19</span><span class="l">months closed for the rebuild</span></div>
          <div class="stat"><span class="n">$412M</span><span class="l">final cost of the project</span></div>
          <div class="stat"><span class="n">$38M</span><span class="l">under the budget approved in 2024</span></div>
          <div class="stat"><span class="n">3</span><span class="l">deep-water berths, up from 2</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>01 / 06</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-deeper-berths">
      <div class="card-top"><span>Port Calloway · Berths</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">Before and after</div>
        <h2>Deep enough for <em>modern ships</em></h2>
        <p class="lede">The old harbor had two berths, both built in 1971. They kept most modern container ships away.</p>
        <div class="gauge">
          <div class="col">
            <div class="wl">Old · 2 berths</div>
            <div class="berths"><span style="height:64%"></span><span style="height:64%"></span></div>
            <div class="d">9 m<small>deepest berth</small></div>
          </div>
          <div class="col new">
            <div class="wl">New · 3 berths</div>
            <div class="berths"><span style="height:100%"></span><span style="height:100%"></span><span style="height:100%"></span></div>
            <div class="d">14 m<small>every berth</small></div>
          </div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>02 / 06</b></div>
    </article></div><figcaption><span>02 · Deeper berths</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-electric-cranes">
      <div class="card-top"><span>Port Calloway · Quay</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">Cleaner quay</div>
        <h2>Electric cranes cut emissions by <em>38%</em></h2>
        <p class="lede">That is the cut in the port's direct emissions, by the harbor master's count.</p>
        <div class="compare">
          <div><span class="tag">Old quay</span><h3>4 diesel cranes</h3><p>Ships ran their engines while they unloaded.</p></div>
          <div class="hi"><span class="tag">New quay</span><h3>6 electric cranes</h3><p>Ships can plug into shore power at two of the three berths.</p></div>
        </div>
        <div class="spacer"></div>
        <p class="quote">The cranes were our biggest single source.</p>
        <div class="who">Tomas Lindqvist, harbor master</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>03 / 06</b></div>
    </article></div><figcaption><span>03 · Electric cranes</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-jobs">
      <div class="card-top"><span>Port Calloway · Jobs</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">Work for the county</div>
        <h2>210 more <em>permanent jobs</em></h2>
        <p class="lede">The rebuild employed 1,850 people at its peak, most of them from Calloway County. Once traffic is at full strength, the town expects 620 permanent harbor jobs.</p>
        <div class="spacer"></div>
        <div class="bars">
          <div style="height:58%"><b>410</b>jobs before the closure</div>
          <div class="acc" style="height:100%"><b>620</b>jobs expected at full traffic</div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>04 / 06</b></div>
    </article></div><figcaption><span>04 · Jobs</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-storm-and-fishing">
      <div class="card-top"><span>Port Calloway · Basin</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">One setback, one surprise</div>
        <h2>A storm hit. <em>Fishers gained.</em></h2>
        <div class="compare">
          <div><span class="tag">Nov 2025</span><h3>6-week delay</h3><p>A storm flooded the new quay wall. Contractor Rennick Marine paid for the repair, so the town paid nothing extra.</p></div>
          <div class="hi"><span class="tag">North basin</span><h3>48 berths</h3><p>The fishing fleet moved to its own basin, with eight more berths than it had before.</p></div>
        </div>
        <div class="spacer"></div>
        <p class="quote">We were braced for losing space, and we gained it.</p>
        <div class="who">Ana Sorell, Calloway Fishermen's Association</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>05 / 06</b></div>
    </article></div><figcaption><span>05 · Storm and fishing</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="06-whats-next">
      <div class="card-top"><span>Port Calloway · Traffic</span><i></i></div>
      <div class="card-body">
        <div class="eyebrow">What to watch</div>
        <h2>From 140 ships to <em>300 a year</em></h2>
        <ol class="tl">
          <li><span class="d">Year one</span><span class="t">140 cargo ship calls expected.</span></li>
          <li><span class="d">By 2030</span><span class="t">300 calls a year.</span></li>
          <li><span class="d">Every month</span><span class="t">The council publishes traffic figures so residents can check the targets.</span></li>
        </ol>
        <div class="spacer"></div>
        <p class="quote">The most important day for this town's economy in fifty years.</p>
        <div class="who">Mayor Delphine Achebe</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>06 / 06</b></div>
    </article></div><figcaption><span>06 · What's next</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
