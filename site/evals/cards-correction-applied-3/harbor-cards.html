<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Calloway reopens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Port berth plan: draft-mark ruler in the top strip, nautical-chart grid ground, berth depths drawn as a draft gauge. */
:root {
  --paper: #EDF0EE;
  --ink: #0F2233;
  --muted: #4F6170;
  --rule: #BFC9CC;
  --accent: #E0531F;
  --accent-ink: #FFFFFF;
  --page: #0B1A27;
  --page-fg: #E4EAEE;
  --display: "Barlow Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.4rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--paper); color: var(--ink); font-family: var(--body);
  background-image:
    linear-gradient(rgb(15 34 51 / .05) 1px, transparent 1px),
    linear-gradient(90deg, rgb(15 34 51 / .05) 1px, transparent 1px);
  background-size: 60px 60px; }
.card-top { height: 56px; flex: none; background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: space-between; padding: 0 80px;
  font: 500 19px var(--mono); letter-spacing: .14em; position: relative; }
.card-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 3px, transparent 3px 30px); }
.card-top .marks { color: var(--accent); }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px;
  border-top: 2px solid var(--ink); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; background: var(--paper); }
.card-foot b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }

.eyebrow { font: 500 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 104px/0.94 var(--display); letter-spacing: -0.01em; margin: -20px 0 0; text-wrap: balance; text-transform: uppercase; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.tag { font: 500 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat:first-child { background: var(--accent); color: var(--accent-ink); }
.stat:first-child .l { color: var(--accent-ink); }
.stat .n { font: 800 132px/1 var(--display); letter-spacing: -0.01em; }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 500 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px; }
.pts li { font-size: 35px; line-height: 1.38; padding-left: 44px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 17px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }

.quote { font: 500 64px/1.08 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 500 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 800 58px/1.0 var(--display); text-transform: uppercase; }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }

/* draft gauge: water depth at the quay, hull-style draft marks on the left */
.gauge { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 24px; height: 420px; flex: none; }
.gauge .scale { position: relative; border-right: 3px solid var(--ink); font: 500 22px var(--mono); }
.gauge .scale span { position: absolute; right: 12px; transform: translateY(-50%); }
.gauge .col { display: flex; flex-direction: column; justify-content: flex-start; border-top: 3px solid var(--ink); }
.gauge .col .w { background: var(--ink); color: var(--paper); padding: 18px 22px; font: 500 24px/1.3 var(--mono);
  display: flex; flex-direction: column; justify-content: flex-end; }
.gauge .col .w b { font: 800 76px/1 var(--display); }
.gauge .col.new .w { background: var(--accent); color: var(--accent-ink); }

.bars { display: flex; align-items: end; gap: 24px; height: 300px; flex: none; }
.bars div { flex: 1; background: var(--ink); color: var(--paper); padding: 20px 24px; font: 500 24px/1.3 var(--mono);
  display: flex; flex-direction: column; justify-content: end; }
.bars div b { font: 800 84px/1 var(--display); }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Port Calloway reopens its rebuilt harbor</h1>
      <p>Five cards from Mira Okafor's report in the Calloway Ledger, 6 March 2026.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>PORT CALLOWAY · BERTH PLAN</span><span class="marks">14M ▸</span></div>
      <div class="card-body">
        <div class="eyebrow">Port Calloway · reopened 4 Mar 2026</div>
        <h2>Rebuilt harbor, <em>620 permanent jobs</em></h2>
        <p class="lede">The harbor is open to cargo ships again after a 19-month rebuild. It can now take ships the old quay kept away.</p>
        <div class="stats">
          <div class="stat"><span class="n">620</span><span class="l">permanent jobs expected at full traffic, up from 410</span></div>
          <div class="stat"><span class="n">14 m</span><span class="l">draft at every berth, up from 9 m</span></div>
          <div class="stat"><span class="n">3</span><span class="l">berths, where the old harbor had 2</span></div>
          <div class="stat"><span class="n">19</span><span class="l">months closed for the full rebuild</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>01 / 05</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-deeper-water">
      <div class="card-top"><span>PORT CALLOWAY · BERTH PLAN</span><span class="marks">14M ▸</span></div>
      <div class="card-body">
        <div class="eyebrow">Berths and draft</div>
        <h2>Room for <em>modern container ships</em></h2>
        <div class="gauge">
          <div class="scale"><span style="top:0">0</span><span style="top:33%">5</span><span style="top:64%">9</span><span style="top:100%">14</span></div>
          <div class="col"><div class="w" style="height:64%"><b>9 m</b>deepest old berth</div></div>
          <div class="col new"><div class="w" style="height:100%"><b>14 m</b>every new berth</div></div>
        </div>
        <div class="compare">
          <div><span class="tag">Before · 1971</span><h3>2 berths</h3><p>The 9 m limit kept most modern container ships away.</p></div>
          <div><span class="tag">Now · 2026</span><h3>3 berths</h3><p>Each one takes ships drawing 14 metres of water.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>02 / 05</b></div>
    </article></div><figcaption><span>02 · Deeper water</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-electric-quay">
      <div class="card-top"><span>PORT CALLOWAY · BERTH PLAN</span><span class="marks">14M ▸</span></div>
      <div class="card-body">
        <div class="eyebrow">Cranes and shore power</div>
        <h2>An <em>electric</em> quay</h2>
        <div class="compare">
          <div><span class="tag">Old quay</span><h3>4 diesel cranes</h3></div>
          <div><span class="tag">New quay</span><h3>6 electric cranes</h3></div>
        </div>
        <ul class="pts">
          <li><b>38% lower emissions.</b> That's the cut in the port's direct emissions from the switch.</li>
          <li><b>Shore power.</b> Ships can plug in at two of the three berths instead of running their engines while they unload.</li>
        </ul>
        <p class="quote">The cranes were our biggest single source.</p>
        <div class="who">Tomas Lindqvist, harbor master</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>03 / 05</b></div>
    </article></div><figcaption><span>03 · Electric quay</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-traffic">
      <div class="card-top"><span>PORT CALLOWAY · BERTH PLAN</span><span class="marks">14M ▸</span></div>
      <div class="card-body">
        <div class="eyebrow">Traffic outlook</div>
        <h2>Ship calls set to <em>double</em> by 2030</h2>
        <div class="bars">
          <div style="height:47%"><b>140</b>calls, year 1</div>
          <div style="height:100%"><b>300</b>calls a year by 2030</div>
        </div>
        <p class="lede">At full traffic the harbor should support 620 permanent jobs, up from 410. The council will publish monthly traffic figures so residents can check the numbers hold.</p>
        <p class="quote">The most important day for this town's economy in fifty years.</p>
        <div class="who">Delphine Achebe, mayor</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>04 / 05</b></div>
    </article></div><figcaption><span>04 · Traffic</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-the-build">
      <div class="card-top"><span>PORT CALLOWAY · BERTH PLAN</span><span class="marks">14M ▸</span></div>
      <div class="card-body">
        <div class="eyebrow">The build</div>
        <h2>Late by six weeks, <em>under budget</em></h2>
        <ol class="tl">
          <li><span class="d">Peak</span><span class="t">1,850 people on the rebuild, most from Calloway County.</span></li>
          <li><span class="d">Nov 2025</span><span class="t">A storm floods the new quay wall and pushes the opening back six weeks. Contractor Rennick Marine pays for the repair.</span></li>
          <li><span class="d">4 Mar 2026</span><span class="t">Reopens at $412M, about $38M under the budget approved in 2024.</span></li>
          <li><span class="d">North basin</span><span class="t">The fishing fleet gets its own basin with 48 berths, eight more than before.</span></li>
        </ol>
        <p class="quote">We were braced for losing space, and we gained it.</p>
        <div class="who">Ana Sorell, Calloway Fishermen's Association</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>05 / 05</b></div>
    </article></div><figcaption><span>05 · The build</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
