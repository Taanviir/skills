<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="graphite-ui/tokens.css">
<link rel="stylesheet" href="graphite-ui/base.css">
<link rel="stylesheet" href="style.css">
<script src="graphite-ui/press.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="side-nav" id="nav">
    <div class="logo">Harvest Desk</div>
    <a class="nav-link active" href="#orders" aria-current="page">Orders</a>
    <a class="nav-link" href="#farms">Farms</a>
    <a class="nav-link" href="#reports">Reports</a>
  </aside>
  <main class="main">
    <header class="page-header">
      <h1>Orders</h1>
      <button class="btn btn-primary" id="new-order">New order</button>
      <button class="btn btn-secondary" id="theme-toggle">Dark mode</button>
    </header>

    <div class="alert alert-warning" id="late-alert">3 orders are late for pickup.</div>

    <section class="stats">
      <div class="stat"><span class="stat-label">Open orders</span><span class="stat-value">42</span></div>
      <div class="stat"><span class="stat-label">Farms</span><span class="stat-value">18</span></div>
      <div class="stat"><span class="stat-label">Kg this week</span><span class="stat-value">3,120</span></div>
    </section>

    <div class="panel">
      <table class="data-table" id="orders">
        <thead><tr><th>Order</th><th>Farm</th><th>Status</th><th class="num">Kg</th><th></th></tr></thead>
        <tbody>
          <tr><td>#1042</td><td>Greyfield</td><td><span class="badge badge-green">Packed</span></td><td class="num">220</td><td class="num"><button class="btn btn-danger btn-sm">Cancel</button></td></tr>
          <tr><td>#1043</td><td>Mossbank</td><td><span class="badge badge-amber">Late</span></td><td class="num">95</td><td class="num"><button class="btn btn-danger btn-sm">Cancel</button></td></tr>
          <tr><td>#1044</td><td>Old Mill</td><td><span class="badge badge-gray">Draft</span></td><td class="num">0</td><td class="num"><button class="btn btn-danger btn-sm">Cancel</button></td></tr>
        </tbody>
      </table>
    </div>

    <form class="panel order-form" id="order-form">
      <h2>Quick order</h2>
      <div class="form-group"><label for="farm">Farm</label><input class="form-control" id="farm" placeholder="Greyfield"></div>
      <div class="form-group"><label for="kg">Kg</label><input class="form-control" id="kg" type="number"></div>
      <button class="btn btn-secondary" type="submit">Save</button>
    </form>

    <canvas id="chart" role="img" aria-label="Kg per day this week"></canvas>
  </main>
</div>

<dialog class="dialog" id="confirm" closedby="any" aria-labelledby="confirm-title">
  <div class="dialog-head">
    <h2 id="confirm-title">Cancel this order?</h2>
  </div>
  <div class="dialog-foot">
    <button class="btn btn-secondary" id="keep">Keep it</button>
    <button class="btn btn-danger solid" id="do-cancel">Cancel order</button>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
