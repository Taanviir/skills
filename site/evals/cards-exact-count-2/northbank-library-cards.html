<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbank Libraries 2025, in 4 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Library date-due slip: manila card stock with ruled lines, a row of stamped due dates up top, red rubber-stamp ink as the accent. */
:root {
  --paper: #F2E7CB;
  --ink: #1E2740;
  --muted: #5E5A4C;
  --rule: #C9B98F;
  --accent: #B8312A;
  --accent-ink: #FFF6E6;
  --page: #2E3B33;
  --page-fg: #EFE8D6;
  --display: "Zilla Slab", Georgia, serif;
  --body: "Libre Franklin", system-ui, sans-serif;
  --mono: "Courier Prime", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 54px, rgb(184 49 42 / .35) 54px, rgb(184 49 42 / .35) 56px, transparent 56px),
    repeating-linear-gradient(180deg, transparent 0 55px, rgb(110 130 170 / .16) 55px 56px);
  color: var(--ink); font-family: var(--body); }
.card-top { height: 64px; flex: none; background: var(--ink); color: var(--paper);
  display: flex; align-items: center; gap: 0; padding: 0 0 0 80px; font: 700 20px var(--mono); letter-spacing: .1em; overflow: hidden; }
.card-top .lbl { padding-right: 28px; text-transform: uppercase; }
.card-top .due { padding: 0 22px; height: 100%; display: flex; align-items: center; border-left: 1px solid rgb(242 231 203 / .3); opacity: .55; white-space: nowrap; }
.card-top .due.now { opacity: 1; background: var(--accent); color: var(--accent-ink); }
.card-body { flex: 1; min-height: 0; padding: 64px 80px 56px 96px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px 26px 96px;
  border-top: 2px solid var(--ink); font: 400 20px var(--mono); color: var(--muted); letter-spacing: .02em; }
.card-foot b { color: var(--ink); font-weight: 700; }
.spacer { flex: 1; }

.eyebrow { font: 700 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 700 84px/1 var(--display); letter-spacing: -0.015em; margin: -20px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.tag { font: 700 21px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }

.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: rgb(255 250 235 / .6); }
.stat { padding: 54px 38px; display: flex; flex-direction: column; gap: 8px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 700 112px/1 var(--display); letter-spacing: -0.02em; }
.stat:nth-child(1) .n { color: var(--accent); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 700 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; text-wrap: pretty; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 30px; }
.pts li { font-size: 35px; line-height: 1.38; padding-left: 44px; position: relative; text-wrap: pretty; }
.pts li::before { content: ""; position: absolute; left: 0; top: 15px; width: 18px; height: 18px; border: 3px solid var(--accent); }
.pts li b { font-weight: 600; }

.quote { font: 500 64px/1.1 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 400 23px var(--mono); color: var(--muted); margin-top: -26px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: rgb(255 250 235 / .6); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 34px; display: flex; flex-direction: column; gap: 14px; }
.compare > div + div { border-left: 2px dashed var(--ink); }
.compare h3 { margin: 0; font: 700 48px/1.05 var(--display); }
.compare p { margin: 0; font-size: 29px; line-height: 1.4; text-wrap: pretty; }

/* rubber-stamped share bars */
.share { display: flex; flex-direction: column; gap: 16px; }
.share .row { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 20px; font: 700 24px var(--mono); }
.share .bar { height: 64px; display: flex; align-items: center; padding: 0 18px; font: 700 30px var(--mono); }
.share .a .bar { width: 22%; background: var(--ink); color: var(--paper); }
.share .b .bar { width: 60%; background: var(--accent); color: var(--accent-ink); }
.card .cover-h { font-size: 96px; }
.stamp { display: inline-block; align-self: flex-start; transform: rotate(-3deg); border: 4px solid var(--accent); color: var(--accent);
  font: 700 26px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 8px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Northbank Libraries 2025, in 4 cards</h1>
      <p>The key points of the Northbank Libraries Annual Report 2025 (February 2026), as 4 shareable cards.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span class="lbl">Date due</span><span class="due">1998</span><span class="due">2023</span><span class="due">2024</span><span class="due now">2025</span><span class="due">2026</span></div>
      <div class="card-body">
        <div class="eyebrow">Northbank Libraries · 2025 report</div>
        <h2 class="cover-h">The library got <em>busier</em> and cheaper per visit</h2>
        <p class="lede">Seven branches stayed open later, dropped late fines and started lending drills and laptops.</p>
        <div class="stats">
          <div class="stat"><span class="n">1.42M</span><span class="l">visits, up 18% on 2024</span></div>
          <div class="stat"><span class="n">$10.30</span><span class="l">cost per visit, down from $11.80</span></div>
          <div class="stat"><span class="n">9 pm</span><span class="l">weekday closing, was 6 pm</span></div>
          <div class="stat"><span class="n">$0</span><span class="l">late fines since 1 Jan 2025</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>01 / 04</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-later-no-fines">
      <div class="card-top"><span class="lbl">Date due</span><span class="due">1998</span><span class="due">2023</span><span class="due">2024</span><span class="due now">2025</span><span class="due">2026</span></div>
      <div class="card-body">
        <div class="eyebrow">What changed</div>
        <h2>Open later.<br><em>No more fines.</em></h2>
        <div class="compare">
          <div><span class="tag">From April</span><h3>Open till 9 pm</h3><p>22 staff moved from back-office cataloguing to the front desk. Extra cost: $310,000 a year.</p></div>
          <div><span class="tag">From 1 Jan 2025</span><h3>Late fines gone</h3><p>Gave up $86,000. Books return 2.1 days later, but lost-item losses fell 11%.</p></div>
        </div>
        <div class="share">
          <div class="tag">Evening share of all visits</div>
          <div class="row a"><span>Before</span><div class="bar">9%</div></div>
          <div class="row b"><span>After</span><div class="bar">24%</div></div>
        </div>
        <p class="lede"><b>3,900 people</b> whose accounts were blocked by unpaid fines came back and borrowed again.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>02 / 04</b></div>
    </article></div><figcaption><span>02 · Later hours, no fines</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-things-and-ebooks">
      <div class="card-top"><span class="lbl">Date due</span><span class="due">1998</span><span class="due">2023</span><span class="due">2024</span><span class="due now">2025</span><span class="due">2026</span></div>
      <div class="card-body">
        <div class="eyebrow">Lending more than books</div>
        <h2>Laptops, telescopes and a <em>carpet cleaner</em></h2>
        <ol class="tl">
          <li><span class="d">Mar 2025</span><span class="t">A “library of things” opens at 2 branches.</span></li>
          <li><span class="d">Sep 2025</span><span class="t">All 7 branches. 640 items, from sewing machines to power drills.</span></li>
          <li><span class="d">All 2025</span><span class="t">12,700 loans. Laptops came first, the carpet cleaner second.</span></li>
        </ol>
        <div class="compare one">
          <div><span class="tag">E-books and audiobooks</span><h3>34% of the budget for 22% of loans</h3><p>Digital loans hit 410,000, up 31%. Publishers charge libraries several times the consumer price, and many licences expire after two years.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>03 / 04</b></div>
    </article></div><figcaption><span>03 · Things and e-books</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-fell-short">
      <div class="card-top"><span class="lbl">Date due</span><span class="due">1998</span><span class="due">2023</span><span class="due">2024</span><span class="due">2025</span><span class="due now">2026</span></div>
      <div class="card-body">
        <div class="eyebrow">Where they fell short</div>
        <p class="quote">I want to explain what changed, what it cost, and where we fell short.</p>
        <div class="who">Priya Raman, director</div>
        <ul class="pts">
          <li><b>Late roof.</b> The Eastgate repair ran five months late and shut the branch for 14 summer weeks.</li>
          <li><b>Missed target.</b> Summer reading reached 5,200 children, short of 6,500.</li>
          <li><b>No van yet.</b> The mobile library van is ordered but arrives mid-2026.</li>
        </ul>
        <div class="spacer"></div>
        <span class="stamp">Next: 2026</span>
        <p class="small">Sunday afternoons at three branches, the van in the rural north, and 200 new items picked by member vote.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>04 / 04</b></div>
    </article></div><figcaption><span>04 · Fell short, 2026 plans</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
