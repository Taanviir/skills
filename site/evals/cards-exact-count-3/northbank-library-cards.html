<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbank Libraries 2025, in 4 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Sans+3:wght@400;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Library catalogue card and date-due slip: ruled index stock, a red margin line, a call-number strip, and violet date-stamp ink. */
:root {
  --paper: #F7F5EE;
  --ink: #1E2A3A;
  --muted: #5A6372;
  --rule: #C9D3DF;
  --accent: #5B3FA0;
  --accent-ink: #FFFFFF;
  --margin-red: #D9544D;
  --page: #1F3A2E;
  --page-fg: #E8EFE9;
  --display: "Zilla Slab", Georgia, serif;
  --body: "Source Sans 3", system-ui, sans-serif;
  --mono: "Courier Prime", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

/* card shell: ruled catalogue-card stock with a red margin line */
.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden; position: relative;
  color: var(--ink); font-family: var(--body);
  background:
    linear-gradient(90deg, transparent 46px, var(--margin-red) 46px, var(--margin-red) 49px, transparent 49px),
    repeating-linear-gradient(180deg, transparent 0 53px, var(--rule) 53px 54px),
    var(--paper); }
.card-top { height: 64px; flex: none; background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: space-between; padding: 0 80px;
  font: 700 22px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.card-top .due { border: 2px solid var(--paper); padding: 3px 12px; transform: rotate(-2deg); opacity: .9; }
.card-body { flex: 1; min-height: 0; padding: 64px 80px 48px; display: flex; flex-direction: column; gap: 44px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 24px 80px; background: var(--paper);
  border-top: 2px solid var(--ink); font: 400 20px var(--mono); color: var(--muted); letter-spacing: .03em; }
.card-foot b { color: var(--ink); font-weight: 700; }
.spacer { flex: 1; }

.eyebrow { font: 700 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 700 88px/0.98 var(--display); letter-spacing: -0.015em; margin: -18px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.card p, .card li, .tl .t { text-wrap: pretty; }
.tag { font: 700 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* stats as a date-due slip: violet stamped figures in a ruled grid */
.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 8px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 700 112px/1 var(--display); letter-spacing: -0.02em; color: var(--accent); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); background: var(--paper); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 700 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 30px; }
.pts li { font-size: 34px; line-height: 1.38; padding-left: 44px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }
.pts.big li { font-size: 38px; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 700 46px/1.05 var(--display); }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }
.compare.stamp { border: 4px solid var(--accent); }
.compare.stamp h3 { color: var(--accent); }
.compare.roomy > div { padding: 40px; gap: 16px; }
.compare.roomy h3 { font-size: 52px; }
.compare.roomy p { font-size: 33px; }

/* paired bars: share of loans vs share of spend, or before vs after */
.pairs { display: flex; flex-direction: column; gap: 18px; }
.pair { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 20px; font: 700 24px var(--mono); }
.pair .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pair .bar { height: 72px; background: var(--ink); color: var(--paper); display: flex; align-items: center; padding: 0 18px; font-size: 28px; white-space: nowrap; }
.pair .bar.hi { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Northbank Libraries 2025, in 4 cards</h1>
      <p>Key points from the Northbank Libraries Annual Report 2025 (published February 2026), as 4 cards to share.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>027.4 NOR · 2025</span><span class="due">Annual report</span></div>
      <div class="card-body">
        <div class="eyebrow">Northbank Libraries · 7 branches</div>
        <h2>They made the library easier to use. <em>People came back.</em></h2>
        <p class="lede">Later hours, no late fines and things to borrow gave the network its busiest year since 1998.</p>
        <div class="stats">
          <div class="stat"><span class="n">1.42M</span><span class="l">visits in 2025, up 18% on 2024</span></div>
          <div class="stat"><span class="n">24%</span><span class="l">of visits now in the evening, up from 9%</span></div>
          <div class="stat"><span class="n">3,900</span><span class="l">people blocked by fines came back to borrow</span></div>
          <div class="stat"><span class="n">$10.30</span><span class="l">cost per visit, down from $11.80</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>01 / 04</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-late-hours-no-fines">
      <div class="card-top"><span>027.4 NOR · 2025</span><span class="due">Return by 9 pm</span></div>
      <div class="card-body">
        <div class="eyebrow">Hours and fines</div>
        <h2>Open later. <em>Stop fining.</em></h2>
        <div class="pairs">
          <div class="pair"><span class="lbl">Evening 2024</span><span class="bar" style="width:37.5%">9%</span></div>
          <div class="pair"><span class="lbl">Evening 2025</span><span class="bar hi" style="width:100%">24% of all visits</span></div>
        </div>
        <div class="compare roomy">
          <div><span class="tag">From April</span><h3>Open until 9 pm</h3><p>Weekdays at all 7 branches, up from 6 pm. 22 staff moved from back-office cataloguing to the front desk. Extra cost: $310,000 a year.</p></div>
          <div><span class="tag">From 1 Jan</span><h3>No late fines</h3><p>Gave up $86,000 a year. Books come back 2.1 days later on average, but lost-item losses fell 11%.</p></div>
        </div>
        <p class="lede"><b>The payoff:</b> 3,900 people whose accounts had been blocked by unpaid fines came back and borrowed again.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>02 / 04</b></div>
    </article></div><figcaption><span>02 · Late hours, no fines</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-things-and-ebooks">
      <div class="card-top"><span>027.4 NOR · 2025</span><span class="due">Date due</span></div>
      <div class="card-body">
        <div class="eyebrow">What people borrow</div>
        <h2>Borrow a drill.<br><em style="white-space:nowrap">E-books cost more.</em></h2>
        <ol class="tl">
          <li><span class="d">March</span><span class="t">"Library of things" opens at 2 branches.</span></li>
          <li><span class="d">September</span><span class="t">All 7 branches lend 640 items, from sewing machines to telescopes.</span></li>
          <li><span class="d">2025 total</span><span class="t">12,700 loans. Laptops top the list, then the carpet cleaner.</span></li>
        </ol>
        <div class="pairs">
          <div class="pair"><span class="lbl">E-book loans</span><span class="bar" style="width:64.7%">22% of loans</span></div>
          <div class="pair"><span class="lbl">E-book spend</span><span class="bar hi" style="width:100%">34% of collection budget</span></div>
        </div>
        <p class="lede">410,000 digital loans, up 31%. Publishers charge libraries several times the consumer price, and many licences expire after two years.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>03 / 04</b></div>
    </article></div><figcaption><span>03 · Things and e-books</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-fell-short-and-next">
      <div class="card-top"><span>027.4 NOR · 2025</span><span class="due">Overdue</span></div>
      <div class="card-body">
        <div class="eyebrow">Where they fell short</div>
        <h2>Not everything <em>arrived on time.</em></h2>
        <ul class="pts big">
          <li><b>Eastgate roof.</b> The repair ran 5 months late and closed the branch for 14 weeks in summer.</li>
          <li><b>Summer reading.</b> 5,200 children took part, short of the 6,500 target, mostly because of Eastgate.</li>
          <li><b>Mobile library van.</b> It's ordered, but won't arrive until mid-2026.</li>
        </ul>
        <div class="compare one stamp roomy">
          <div><span class="tag">Coming in 2026</span><h3>Sundays, a van and 200 new things</h3><p>Sunday afternoon hours at 3 branches. The van starts in the rural north. Members vote on 200 new items for the library of things.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>04 / 04</b></div>
    </article></div><figcaption><span>04 · Fell short, and 2026</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
