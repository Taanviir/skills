<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Calloway's rebuilt harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Nautical chart: buoy-striped top strip, chart-grid ground with depth soundings, depth bars that hang down like a sounding line. */
:root {
  --paper: #E9F0EE;
  --ink: #0F2B3D;
  --muted: #4E6573;
  --rule: #B9CCCB;
  --accent: #C4202F;
  --accent-ink: #FFFFFF;
  --page: #0B1F2C;
  --page-fg: #E3ECEE;
  --display: "Barlow Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.6rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden; position: relative;
  color: var(--ink); font-family: var(--body);
  background-color: var(--paper);
  background-image:
    linear-gradient(rgb(15 43 61 / .06) 1px, transparent 1px),
    linear-gradient(90deg, rgb(15 43 61 / .06) 1px, transparent 1px);
  background-size: 90px 90px; background-position: -1px -1px; }
.card-top { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 80px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 26px, #fff 26px 52px);
  border-bottom: 3px solid var(--ink); }
.card-top span { font: 500 18px var(--mono); letter-spacing: .14em; background: var(--ink); color: var(--paper); padding: 4px 12px; }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px; background: var(--paper);
  border-top: 2px solid var(--ink); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
.card-foot b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }

.eyebrow { font: 500 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 104px/0.94 var(--display); letter-spacing: -0.01em; margin: -20px 0 0; text-wrap: balance; text-transform: uppercase; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); text-wrap: pretty; }
.tag { font: 500 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 800 132px/1 var(--display); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 500 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px; }
.pts li { font-size: 35px; line-height: 1.38; padding-left: 48px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--accent); }
.pts li b { font-weight: 600; }

.quote { font: 500 66px/1.04 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 500 22px var(--mono); color: var(--muted); margin-top: -28px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; border-left: 10px solid var(--accent); }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 800 54px/1 var(--display); text-transform: uppercase; }
.compare p { margin: 0; font-size: 30px; line-height: 1.38; }

/* sounding line: bars hang down from the waterline */
.sound { display: flex; gap: 28px; flex: none; border-top: 4px solid var(--ink); position: relative; }
.sound::before { content: "QUAY · WATERLINE"; position: absolute; top: -34px; right: 0; font: 500 18px var(--mono); letter-spacing: .12em; color: var(--muted); }
.sound > div { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.sound .bar { background: repeating-linear-gradient(180deg, var(--ink) 0 38px, #24485F 38px 40px); color: var(--paper); font: 800 72px/1 var(--display); padding: 20px 26px; display: flex; align-items: end; }
.sound .now .bar { background: repeating-linear-gradient(180deg, var(--accent) 0 38px, #A31523 38px 40px); }
.sound .cap { font: 500 22px/1.35 var(--mono); color: var(--muted); }

.bars { display: flex; align-items: end; gap: 22px; height: 300px; flex: none; border-bottom: 3px solid var(--ink); }
.bars div { flex: 1; background: var(--ink); color: var(--paper); padding: 18px 24px; font: 500 24px/1.3 var(--mono); display: flex; flex-direction: column; justify-content: end; }
.bars div b { font: 800 76px/1 var(--display); }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }

.berths { display: flex; align-items: center; gap: 36px; flex: none; }
.berths .n { font: 800 260px/0.85 var(--display); }
.berths .old { color: var(--muted); }
.berths .arrow { font: 800 120px/1 var(--display); color: var(--accent); }
.berths .lbl { font: 500 24px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Port Calloway's rebuilt harbor</h1>
      <p>6 cards from the Calloway Ledger article by Mira Okafor, 6 March 2026.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>PORT CALLOWAY</span></div>
      <div class="card-body">
        <div class="eyebrow">Port Calloway · Harbor rebuild</div>
        <h2>The harbor is <em>back</em>, and bigger</h2>
        <p class="lede">The rebuilt harbor reopened to cargo ships on 4 March 2026, and it came in under budget.</p>
        <div class="stats">
          <div class="stat"><span class="n">19</span><span class="l">months closed for the rebuild</span></div>
          <div class="stat"><span class="n">$412M</span><span class="l">final cost, $38M under budget</span></div>
          <div class="stat"><span class="n">3</span><span class="l">berths for 14 m ships, up from 2</span></div>
          <div class="stat"><span class="n">620</span><span class="l">permanent jobs expected, up from 410</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>01 / 06</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-deeper">
      <div class="card-top"><span>BERTHS · DEPTH</span></div>
      <div class="card-body">
        <div class="eyebrow">Bigger and deeper</div>
        <h2>Room for <em>modern</em> container ships</h2>
        <div class="berths">
          <div><div class="n old">2</div><div class="lbl">berths, 1971</div></div>
          <div class="arrow">→</div>
          <div><div class="n">3</div><div class="lbl">berths, 2026</div></div>
        </div>
        <div class="sound">
          <div><div class="bar" style="height:216px">9 m</div><div class="cap">Old deepest berth</div></div>
          <div class="now"><div class="bar" style="height:336px">14 m</div><div class="cap">Every new berth</div></div>
        </div>
        <p class="small">The old 9 m limit kept most modern container ships away.</p>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>02 / 06</b></div>
    </article></div><figcaption><span>02 · Bigger and deeper</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-cleaner">
      <div class="card-top"><span>CRANES · POWER</span></div>
      <div class="card-body">
        <div class="eyebrow">Cleaner quay</div>
        <h2>Direct emissions down <em>38%</em></h2>
        <div class="compare">
          <div><span class="tag">Old quay</span><h3>4 diesel cranes</h3><p>The port's biggest single source of emissions.</p></div>
          <div><span class="tag">New quay</span><h3>6 electric cranes</h3><p>More cranes, and none burning diesel.</p></div>
        </div>
        <ul class="pts">
          <li><b>Shore power.</b> At two of the three berths, ships plug in instead of running their engines.</li>
        </ul>
        <div class="spacer"></div>
        <p class="quote">The cranes were our biggest single source.</p>
        <div class="who">Tomas Lindqvist, harbor master</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>03 / 06</b></div>
    </article></div><figcaption><span>03 · Cleaner</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-jobs-money">
      <div class="card-top"><span>JOBS · COST</span></div>
      <div class="card-body">
        <div class="eyebrow">Jobs and money</div>
        <h2>More jobs, <em>no</em> extra cost</h2>
        <div class="bars">
          <div style="height:62%"><b>410</b>jobs before</div>
          <div style="height:94%"><b>620</b>expected at full traffic</div>
        </div>
        <p class="small">The rebuild itself employed 1,850 people at its peak, most from Calloway County.</p>
        <div class="compare one">
          <div><span class="tag">Nov 2025 · Storm</span><h3>Six weeks late, same price</h3><p>A storm flooded the new quay wall. The contractor, Rennick Marine, paid for the repairs under its contract.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>04 / 06</b></div>
    </article></div><figcaption><span>04 · Jobs and money</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-fishing">
      <div class="card-top"><span>NORTH BASIN</span></div>
      <div class="card-body">
        <div class="eyebrow">The fishing fleet</div>
        <h2>Fishing crews <em>gained</em> space</h2>
        <p class="lede">Crews feared the rebuild would squeeze them out. Instead the fleet moved to its own basin on the north side.</p>
        <div class="berths">
          <div><div class="n old">40</div><div class="lbl">berths before</div></div>
          <div class="arrow">→</div>
          <div><div class="n">48</div><div class="lbl">berths now</div></div>
        </div>
        <div class="spacer"></div>
        <p class="quote">We were braced for losing space, and we gained it.</p>
        <div class="who">Ana Sorell, chair, Calloway Fishermen's Association</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>05 / 06</b></div>
    </article></div><figcaption><span>05 · Fishing fleet</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="06-next">
      <div class="card-top"><span>SHIP CALLS</span></div>
      <div class="card-body">
        <div class="eyebrow">What comes next</div>
        <h2>Ship calls set to <em>double</em></h2>
        <div class="bars">
          <div style="height:47%"><b>140</b>first year</div>
          <div style="height:100%"><b>300</b>a year by 2030</div>
        </div>
        <p class="quote">The most important day for this town's economy in fifty years.</p>
        <div class="who">Mayor Delphine Achebe</div>
        <div class="spacer"></div>
        <p class="small">The council will publish traffic figures every month so residents can check the numbers.</p>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>06 / 06</b></div>
    </article></div><figcaption><span>06 · What's next</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
