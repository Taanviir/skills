<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Meta built Muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Eval spreadsheet: column letters in the top strip, cell-grid ground, pass/fail cells. */
:root {
  --paper: #F7F8F6;
  --ink: #17201B;
  --muted: #56615A;
  --rule: #CBD3CD;
  --accent: #107C41;
  --accent-ink: #FFFFFF;
  --fail: #C42B1C;
  --page: #1F2A24;
  --page-fg: #E6ECE8;
  --display: "Archivo", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--paper); color: var(--ink); font-family: var(--body);
  background-image: linear-gradient(#E6EAE7 1px, transparent 1px), linear-gradient(90deg, #E6EAE7 1px, transparent 1px);
  background-size: 90px 45px; background-position: 0 -1px; }
.card-top { height: 44px; flex: none; display: grid; grid-template-columns: 44px repeat(11, 1fr);
  background: #E3E8E4; border-bottom: 2px solid var(--ink); font: 500 18px/42px var(--mono); color: var(--muted); text-align: center; }
.card-top span { border-right: 1px solid var(--rule); }
.card-top span:first-child { background: #D3DAD5; }
.card-top span.on { background: var(--accent); color: var(--accent-ink); }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px; background: var(--paper);
  border-top: 2px solid var(--ink); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
.card-foot b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }

.eyebrow { font: 500 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 84px/0.98 var(--display); letter-spacing: -0.025em; margin: -20px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.chip { font: 500 0.8em var(--mono); padding: 2px 10px; border-radius: 4px; white-space: nowrap; background: var(--ink); color: var(--paper); }
.chip.pass { background: var(--accent); color: var(--accent-ink); }
.chip.fail { background: var(--fail); color: #fff; }
.tag { font: 500 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 44px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 800 116px/1 var(--display); letter-spacing: -0.03em; }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); background: var(--paper); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 500 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 30px; line-height: 1.38; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 56px 1fr; gap: 22px; align-items: baseline; font-size: 31px; line-height: 1.36; counter-increment: s; }
.steps li::before { content: counter(s); font: 500 24px/52px var(--mono); text-align: center; width: 52px; height: 52px; background: var(--ink); color: var(--paper); border-radius: 4px; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px; }
.pts li { font-size: 34px; line-height: 1.38; padding-left: 44px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }

.quote { font: 500 60px/1.1 var(--display); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 500 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 800 46px/1.05 var(--display); }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }
.compare .bad .tag { color: var(--fail); }
.compare .good .tag { color: var(--accent); }

.bars { display: flex; align-items: end; gap: 14px; height: 220px; flex: none; }
.bars div { flex: 1; background: var(--ink); color: var(--paper); border-radius: 4px 4px 0 0; padding: 16px 18px; font: 500 22px/1.3 var(--mono); display: flex; align-items: end; }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }

[data-name="01-cover"] .stat .n { font-size: 150px; }
[data-name="01-cover"] .stat { padding: 56px 44px; }
[data-name="01-cover"] h2 { font-size: 104px; margin-bottom: -24px; }
[data-name="01-cover"] .card-body { gap: 40px; }
.big .pts li { font-size: 37px; }
.big .compare p { font-size: 32px; }
.big .compare h3 { font-size: 52px; }
.big .steps li { font-size: 35px; }
.big .lede { font-size: 40px; }
.big .bars { height: 300px; }
/* 100 eval rows drawn as pass/fail cells */
.sheet { display: flex; flex-direction: column; gap: 14px; }
.sheet .row-h { display: flex; justify-content: space-between; font: 500 24px var(--mono); }
.sheet .row-h b { font-weight: 500; }
.cells { display: grid; grid-template-columns: repeat(25, 1fr); gap: 5px; }
.cells i { aspect-ratio: 1; background: var(--accent); border-radius: 2px; }
.cells.mixed i:nth-child(n+81) { background: var(--fail); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>How Meta built Muse</h1>
      <p>8 cards from Alexandr Wang's interview on building Muse (YouTube, Oct 2026).</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span></span><span class="on">A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">Alexandr Wang · Meta Superintelligence Labs</div>
        <h2>How Meta built <em>Muse</em></h2>
        <p class="lede">A quick prototype, then seven months of checking the same list of behaviors until every one passed.</p>
        <div class="stats">
          <div class="stat"><span class="n">1–2</span><span class="l">weeks to build the first prototype</span></div>
          <div class="stat"><span class="n">7</span><span class="l">months from prototype to launch</span></div>
          <div class="stat"><span class="n">100+</span><span class="l">behaviors, each with its own eval</span></div>
          <div class="stat"><span class="n">&lt;200</span><span class="l">people on model and product</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>01 / 08</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-origin">
      <div class="card-top"><span></span><span>A</span><span class="on">B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">Where it started</div>
        <h2>From a memo to a <em>board demo</em></h2>
        <ol class="tl">
          <li><span class="d">Jun 2025</span><span class="t">Mark Zuckerberg's "Personal Super Intelligence" memo, written with Wang and Nat Friedman, sets the lab's mission.</span></li>
          <li><span class="d">Early 2026</span><span class="t">Opus 4.5 and OpenClaw show what agents can do. Nat Friedman calls his first run "somewhere between terrifying and euphoric".</span></li>
          <li><span class="d">Feb 2026</span><span class="t">Wang's first session is a psychoanalysis prompt. He likens it to "3 years of therapy".</span></li>
          <li><span class="d">Feb 2026</span><span class="t">Both write memos to the board. Wang's calls the super agent "the final consumer product".</span></li>
          <li><span class="d">+1–2 weeks</span><span class="t">A working prototype is demoed to the board.</span></li>
          <li><span class="d">7 months on</span><span class="t">Muse launches, after months of earnings calls hinting at personal agents.</span></li>
        </ol>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>02 / 08</b></div>
    </article></div><figcaption><span>02 · Origin</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card big" data-name="03-prototype-to-product">
      <div class="card-top"><span></span><span>A</span><span>B</span><span class="on">C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">The hard part</div>
        <h2>The demo was magic. Making it <em>reliable</em> took 7 months.</h2>
        <p class="lede">The OpenClaw craze peaked and faded because agents kept breaking. Meta's bet was that polish, not new ideas, would fix that.</p>
        <div class="compare">
          <div class="bad"><span class="tag">Feb prototype</span><h3>Sometimes magic</h3><p>The mascot and an early Muse Charm were already there. Most of the time it didn't work.</p></div>
          <div class="good"><span class="tag">Launch</span><h3>Highly reliable</h3><p>Model and product tuned together so most people get a great experience.</p></div>
        </div>
        <p class="small">Wang's word for the unglamorous part: "really grinding out and sanding out all of the details."</p>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>03 / 08</b></div>
    </article></div><figcaption><span>03 · Prototype to product</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card big" data-name="04-the-spreadsheet">
      <div class="card-top"><span></span><span>A</span><span>B</span><span>C</span><span class="on">D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">The method</div>
        <h2>One long <em>spreadsheet</em></h2>
        <p class="lede">Wang calls it "very very meticulous". The model roadmap was aimed at personal agents, and this sheet ran the work.</p>
        <ol class="steps">
          <li><span><b>List it.</b> Over 100 specific behaviors a personal agent needs.</span></li>
          <li><span><b>Measure it.</b> Build an eval for every row.</span></li>
          <li><span><b>Set the bar.</b> Each row gets a <span class="chip fail">launch-blocking</span> and a <span class="chip pass">good</span> threshold.</span></li>
          <li><span><b>Sand it.</b> Review the sheet, find the weak rows, train the model on them, repeat.</span></li>
        </ol>
        <div class="compare one"><div><span class="tag">Meta culture</span><p>Once you know what you're measuring, you can optimize it. Before AI that meant conversion and onboarding. For Muse it meant the model.</p></div></div>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>04 / 08</b></div>
    </article></div><figcaption><span>04 · The spreadsheet</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-ready">
      <div class="card-top"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span class="on">E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">How they knew it was ready</div>
        <h2>Ship only when <em>every row</em> is green</h2>
        <div class="sheet">
          <div class="row-h"><b>Many checkpoints</b><span>80 green · 20 red</span></div>
          <div class="cells mixed" data-n="100"></div>
        </div>
        <p class="quote">We knew that wasn't good enough.</p>
        <div class="sheet">
          <div class="row-h"><b>Muse Spark 1.3 (special build)</b><span>all green</span></div>
          <div class="cells" data-n="100"></div>
        </div>
        <p class="small">Then the gut check: the team tried it and could tell it was a lot better than anything before.</p>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>05 / 08</b></div>
    </article></div><figcaption><span>05 · Launch bar</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card big" data-name="06-small-team">
      <div class="card-top"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span class="on">F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">The team</div>
        <h2>Under 200 people, <em>one point of view</em></h2>
        <p class="quote">We knew it was a single work of art.</p>
        <div class="who">Alexandr Wang</div>
        <ul class="pts">
          <li><b>Kept small on purpose.</b> Leadership knew it was one of Meta's most important launches of the year and still held the team down.</li>
          <li><b>No "PM hell".</b> Big-company products turn into a "Frankenstein" of every PM's pet feature. Muse had to be the opposite.</li>
          <li><b>One taste.</b> Nat Friedman's taste and sensibilities shaped what Muse became.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>06 / 08</b></div>
    </article></div><figcaption><span>06 · Small team</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card big" data-name="07-why-meta">
      <div class="card-top"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span class="on">G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">The bet</div>
        <h2>Everyone chased coding. Meta went <em>personal.</em></h2>
        <div class="compare">
          <div><span class="tag">Industry, early 2026</span><h3>Coding agents</h3><p>Anthropic was far ahead, and the conventional wisdom was that coding was the only form factor that mattered.</p></div>
          <div class="good"><span class="tag">Meta</span><h3>Personal agents</h3><p>Apps used by 3.5 billion people every day. Consumer AI was the natural place to win.</p></div>
        </div>
        <p class="quote" style="font-size:50px">Meta is actually a really special company if we have AGI.</p>
        <p class="lede">Wang's pitch: AI takes over the things we <b>have</b> to do. Meta's apps are the things we <b>want</b> to do.</p>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>07 / 08</b></div>
    </article></div><figcaption><span>07 · Why Meta</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card big" data-name="08-growth">
      <div class="card-top"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span class="on">H</span><span>I</span><span>J</span><span>K</span></div>
      <div class="card-body">
        <div class="eyebrow">Launch</div>
        <h2>Memes, screenshots and a <em>trust fall</em></h2>
        <ul class="pts">
          <li><b>Memes.</b> Wang wrote every meme tweet himself, because "the internet rewards risk".</li>
          <li><b>Screenshots.</b> The mascot in every chat makes a screenshot instantly read as Muse when it's shared.</li>
          <li><b>Trust.</b> Users hand it bigger and bigger jobs, and it has to work every time.</li>
        </ul>
        <div class="bars">
          <div style="height:30%">small task</div>
          <div style="height:55%">bigger</div>
          <div style="height:78%">bigger</div>
          <div style="height:100%">full trust</div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Alexandr Wang interview, YouTube, Oct 2026</span><b>08 / 08</b></div>
    </article></div><figcaption><span>08 · Growth</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
document.querySelectorAll('.cells').forEach(c => { c.innerHTML = '<i></i>'.repeat(+c.dataset.n); });

function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
