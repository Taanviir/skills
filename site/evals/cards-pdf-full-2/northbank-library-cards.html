<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbank Libraries 2025, in 7 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin="anonymous" lets the PNG export read the font CSS. Keep it when swapping families. -->
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Public+Sans:wght@400;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Library catalogue card and date-due slip: ruled card stock, a due-date stamp strip on top, violet stamp ink for numbers. */
:root {
  --paper: #EEF2EA;      /* card ground */
  --ink: #1F2A24;        /* text, rules, dark blocks */
  --muted: #56645B;      /* secondary text */
  --rule: #C4CEC2;       /* hairlines */
  --accent: #5B3FA8;     /* the one bold color */
  --accent-ink: #FFFFFF; /* text on accent */
  --page: #2C3A33;       /* gallery page behind the cards */
  --page-fg: #E6ECE4;
  --display: "Zilla Slab", Georgia, serif;
  --body: "Public Sans", system-ui, sans-serif;
  --mono: "Courier Prime", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

/* ---------- gallery page, the collage view ---------- */
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

/* ---------- card shell, 1080x1350, sizes in px at full scale ---------- */
.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background: repeating-linear-gradient(to bottom, transparent 0 63px, rgb(91 63 168 / .07) 63px 65px), var(--paper);
  color: var(--ink); font-family: var(--body); }
.card-top { height: 56px; flex: none; background: var(--ink); color: var(--paper); display: flex; align-items: center;
  padding: 0 80px; gap: 0; font: 700 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.card-top span { padding: 0 22px; border-left: 2px dashed rgb(238 242 234 / .4); }
.card-top span:first-child { padding-left: 0; border-left: 0; }
.card-top .due { margin-left: auto; color: #C9B8F2; }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px;
  border-top: 2px solid var(--ink); font: 400 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
.card-foot b { color: var(--ink); font-weight: 700; }
.spacer { flex: 1; }

.eyebrow { font: 700 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 700 86px/0.98 var(--display); letter-spacing: -0.02em; margin: -20px 0 0; text-wrap: balance; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; text-wrap: pretty; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); text-wrap: pretty; }
.chip { font: 700 0.8em var(--mono); padding: 2px 10px; border-radius: 4px; white-space: nowrap; background: var(--ink); color: var(--paper); }
.tag { font: 700 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* ---------- components ---------- */
/* stats styled as a date-due slip: numbers inked like stamps */
.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: #F7F9F4; }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 10px; }
.stat:nth-child(odd) { border-right: 2px dashed var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px dashed var(--ink); }
.stat .n { font: 700 104px/1 var(--mono); letter-spacing: -0.04em; color: var(--accent); transform: rotate(-2deg); transform-origin: left center; }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 700 28px/1.4 var(--mono); color: var(--accent); }
.tl .t { font-size: 32px; line-height: 1.38; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 24px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 56px 1fr; gap: 22px; align-items: baseline; font-size: 32px; line-height: 1.36; counter-increment: s; }
.steps li::before { content: counter(s); font: 700 24px/52px var(--mono); text-align: center; width: 52px; height: 52px; background: var(--ink); color: var(--paper); border-radius: 4px; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 34px; }
.pts li { font-size: 35px; line-height: 1.38; padding-left: 44px; position: relative; text-wrap: pretty; }
.pts li::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }
.pts.lg { gap: 48px; }
.pts.lg li { font-size: 41px; }
.pts.lg li::before { top: 20px; width: 22px; height: 22px; }
.quote.lg { font-size: 70px; }
.tl.lg .t { font-size: 36px; }
.tl.lg li { padding: 28px 0; }
.steps.lg li { font-size: 37px; }
.compare h3.big.money { font-size: 96px; }

.quote { font: 500 58px/1.12 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 400 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: #F7F9F4; }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 700 46px/1.05 var(--display); }
.compare h3.big { font: 700 120px/1 var(--mono); letter-spacing: -0.04em; color: var(--accent); }
.compare p { margin: 0; font-size: 30px; line-height: 1.38; }

/* horizontal share bars, like a borrowing-record ledger */
.hbars { display: flex; flex-direction: column; gap: 22px; }
.hbar { display: grid; grid-template-columns: 260px 1fr; align-items: center; gap: 24px; }
.hbar .k { font: 700 26px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hbar .v { height: 88px; background: var(--ink); color: var(--paper); display: flex; align-items: center; padding: 0 24px; font: 700 40px var(--mono); border-radius: 0 4px 4px 0; }
.hbar .v.hi { background: var(--accent); color: var(--accent-ink); }
.hbar .v.ghost { background: transparent; color: var(--ink); border: 3px dashed var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Northbank Libraries 2025, in 7 cards</h1>
      <p>The main points of the Northbank Libraries Annual Report 2025 (published February 2026), in 7 cards.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2025</span></div>
      <div class="card-body">
        <div class="eyebrow">7 branches · busiest year since 1998</div>
        <h2>The library got <em>busier</em> by getting easier to use</h2>
        <p class="lede">Later hours, no fines, and you can borrow a drill. Here's what worked, what it cost and what went wrong.</p>
        <div class="stats">
          <div class="stat"><span class="n">1.42M</span><span class="l">visits in 2025, up 18%</span></div>
          <div class="stat"><span class="n">24%</span><span class="l">of visits now happen in the evening</span></div>
          <div class="stat"><span class="n">$0</span><span class="l">in late fines since 1 Jan 2025</span></div>
          <div class="stat"><span class="n">12,700</span><span class="l">loans of things that aren't books</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>01 / 07</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-evening-hours">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2025</span></div>
      <div class="card-body">
        <div class="eyebrow">Opening hours</div>
        <h2>Open until <em>9 pm</em>, and people came</h2>
        <p class="lede">From April, all seven branches stayed open three extra hours on weekdays.</p>
        <div class="compare">
          <div><span class="tag">Closing at 6 pm</span><h3 class="big">9%</h3><p>of all visits were in the evening.</p></div>
          <div><span class="tag">Closing at 9 pm</span><h3 class="big">24%</h3><p>of all visits are now in the evening.</p></div>
        </div>
        <ul class="pts">
          <li><b>The cost.</b> $310,000 a year in extra building and security costs.</li>
          <li><b>The staff.</b> 22 people moved from back-office cataloguing, now shared with the county, to the front desk.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>02 / 07</b></div>
    </article></div><figcaption><span>02 · Evening hours</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-no-fines">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2025</span></div>
      <div class="card-body">
        <div class="eyebrow">Fines · scrapped 1 Jan 2025</div>
        <h2>No more late fines. <em>Fewer books went missing.</em></h2>
        <ul class="pts lg">
          <li><b>The price.</b> Fines brought in $86,000 in 2024. That money is gone.</li>
          <li><b>The catch.</b> The average loan now comes back 2.1 days later than before.</li>
          <li><b>The win.</b> 3,900 people whose accounts were blocked by unpaid fines came back and borrowed again.</li>
          <li><b>The surprise.</b> Lost-item losses fell 11%, because people were no longer afraid to return overdue books.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>03 / 07</b></div>
    </article></div><figcaption><span>03 · No more fines</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-library-of-things">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2025</span></div>
      <div class="card-body">
        <div class="eyebrow">The library of things</div>
        <h2>Borrow a <em>telescope</em>, a sewing machine or a drill</h2>
        <ol class="tl lg">
          <li><span class="d">Mar 2025</span><span class="t">Starts at two branches.</span></li>
          <li><span class="d">Sep 2025</span><span class="t">Running at all seven branches.</span></li>
          <li><span class="d">By year end</span><span class="t">640 items to borrow, lent out 12,700 times.</span></li>
          <li><span class="d">2026</span><span class="t">200 more items, picked by vote.</span></li>
        </ol>
        <div class="spacer"></div>
        <p class="quote lg">Laptops were the most borrowed item, followed by the carpet cleaner.</p>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>04 / 07</b></div>
    </article></div><figcaption><span>04 · Library of things</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-ebooks">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2025</span></div>
      <div class="card-body">
        <div class="eyebrow">Digital lending</div>
        <h2>E-books are popular, and <em>pricey</em> for libraries</h2>
        <p class="lede">E-book and audiobook loans hit 410,000, up 31%. Their licences cost $1.9 million.</p>
        <div class="hbars">
          <div class="hbar"><span class="k">Share of loans</span><span class="v" style="width:65%">22%</span></div>
          <div class="hbar"><span class="k">Share of collection budget</span><span class="v hi" style="width:100%">34%</span></div>
        </div>
        <ul class="pts">
          <li><b>Why.</b> Publishers charge libraries several times the consumer price, and many licences expire after two years.</li>
          <li><b>Next.</b> The library is lobbying the state for a fair-pricing law.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>05 / 07</b></div>
    </article></div><figcaption><span>05 · E-book pricing</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="06-fell-short">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Overdue</span></div>
      <div class="card-body">
        <div class="eyebrow">Where they fell short</div>
        <h2>A late roof repair, a <em>missed target</em> and a late van</h2>
        <p class="lede">The Eastgate roof repair ran five months late. The branch closed for 14 weeks in summer, when kids' programs are busiest.</p>
        <div class="hbars">
          <div class="hbar"><span class="k">Summer reading target</span><span class="v ghost" style="width:100%">6,500 kids</span></div>
          <div class="hbar"><span class="k">Kids reached</span><span class="v hi" style="width:80%">5,200</span></div>
        </div>
        <ul class="pts">
          <li><b>Why.</b> The shortfall was mostly because of the Eastgate closure.</li>
          <li><b>The van.</b> The mobile library van was ordered but won't arrive until mid-2026.</li>
        </ul>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>06 / 07</b></div>
    </article></div><figcaption><span>06 · Where they fell short</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="07-money-and-2026">
      <div class="card-top"><span>Northbank Libraries</span><span>Annual report</span><span class="due">Date due · 2026</span></div>
      <div class="card-body">
        <div class="eyebrow">Money · and what's next</div>
        <h2>Each visit got <em>cheaper</em></h2>
        <div class="compare">
          <div><span class="tag">2024</span><h3 class="big money">$11.80</h3><p>cost per visit</p></div>
          <div><span class="tag">2025</span><h3 class="big money">$10.30</h3><p>cost per visit</p></div>
        </div>
        <p class="small">The $14.6M budget rose 4%, but visits grew faster. Staff $7.1M, collections $5.6M, buildings and evening hours $1.9M.</p>
        <div class="tag">Coming in 2026</div>
        <ol class="steps lg">
          <li><span>Sunday afternoon opening at three branches.</span></li>
          <li><span>The mobile library van for the rural north.</span></li>
          <li><span>200 new items in the library of things, picked by member vote.</span></li>
        </ol>
      </div>
      <div class="card-foot"><span>Source: Northbank Libraries Annual Report 2025, Feb 2026</span><b>07 / 07</b></div>
    </article></div><figcaption><span>07 · Money and 2026</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
