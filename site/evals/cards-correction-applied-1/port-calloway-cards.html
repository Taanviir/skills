<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Calloway reopens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* A port notice board: a hull draft-mark scale in the top strip, a faint chart grid on steel-grey paper, and antifouling red as the accent. */
:root {
  --paper: #E6EAEC;
  --ink: #0F2433;
  --muted: #4E6170;
  --rule: #B9C4CB;
  --accent: #B8321F;
  --accent-ink: #FFFFFF;
  --page: #0A1A25;
  --page-fg: #E3E9ED;
  --display: "Big Shoulders Display", system-ui, sans-serif;
  --body: "Public Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}

/* ---------- gallery page, the collage view ---------- */
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.2rem; margin: 0; text-wrap: balance; }
header.page p { margin: 6px 0 0; opacity: .7; max-width: 60ch; line-height: 1.5; }
button { font: 600 0.95rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 32px 24px; }
figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.frame .card { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 0.85rem var(--mono); opacity: .8; }

/* ---------- card shell, 1080x1350, sizes in px at full scale ---------- */
.card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--paper); color: var(--ink); font-family: var(--body);
  background-image:
    linear-gradient(rgb(15 36 51 / .045) 1px, transparent 1px),
    linear-gradient(90deg, rgb(15 36 51 / .045) 1px, transparent 1px);
  background-size: 54px 54px; }
.card-top { height: 64px; flex: none; background-color: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: space-between; padding: 0 80px;
  font: 500 20px var(--mono); letter-spacing: .14em; text-transform: uppercase;
  background-image:
    repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 40px),
    repeating-linear-gradient(90deg, rgb(230 234 236 / .55) 0 2px, transparent 2px 20px);
  background-size: 100% 14px, 100% 7px;
  background-position: 0 100%, 0 100%;
  background-repeat: no-repeat; }
.card-top .draft { color: var(--accent); filter: brightness(1.6); }
.card-body { flex: 1; min-height: 0; padding: 72px 80px 56px; display: flex; flex-direction: column; gap: 48px; }
.card-foot { flex: none; display: flex; justify-content: space-between; padding: 26px 80px;
  border-top: 2px solid var(--ink); font: 500 20px var(--mono); color: var(--muted); letter-spacing: .04em; background: var(--paper); }
.card-foot b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }

.eyebrow { font: 500 22px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.card h2 { font: 800 100px/0.95 var(--display); letter-spacing: -0.01em; margin: -20px 0 0; text-wrap: balance; text-transform: uppercase; }
.card h2 em { font-style: normal; color: var(--accent); }
.lede { font-size: 37px; line-height: 1.4; margin: 0; }
.small { font-size: 28px; line-height: 1.4; margin: 0; color: var(--muted); }
.chip { font: 500 0.8em var(--mono); padding: 2px 10px; border-radius: 4px; white-space: nowrap; background: var(--ink); color: var(--paper); }
.tag { font: 500 21px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* ---------- components ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 40px 40px; display: flex; flex-direction: column; gap: 6px; }
.stat:nth-child(odd) { border-right: 2px solid var(--ink); }
.stat:nth-child(-n+2) { border-bottom: 2px solid var(--ink); }
.stat .n { font: 800 128px/1 var(--display); letter-spacing: -0.01em; }
.stat:first-child { background: var(--ink); color: var(--paper); }
.stat:first-child .n { color: #FF7A5C; }
.stat:first-child .l { color: var(--rule); }
.stat .l { font-size: 29px; color: var(--muted); line-height: 1.3; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.tl li { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.tl .d { font: 500 26px/1.5 var(--mono); color: var(--accent); }
.tl .t { font-size: 31px; line-height: 1.38; }

.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px; }
.pts li { font-size: 34px; line-height: 1.38; padding-left: 44px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; background: var(--accent); }
.pts li b { font-weight: 600; }
.pts.big { gap: 44px; }
.pts.big li { font-size: 40px; }
.pts.big li::before { top: 19px; width: 22px; height: 22px; }
.quote.big { font-size: 84px; }

.quote { font: 500 64px/1.05 var(--display); margin: 0; text-wrap: balance; }
.quote::before { content: "\201C"; color: var(--accent); }
.quote::after { content: "\201D"; color: var(--accent); }
.who { font: 500 22px var(--mono); color: var(--muted); margin-top: -24px; letter-spacing: .04em; }

.compare { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--paper); }
.compare.one { grid-template-columns: 1fr; }
.compare > div { padding: 36px; display: flex; flex-direction: column; gap: 12px; }
.compare > div + div { border-left: 2px solid var(--ink); }
.compare h3 { margin: 0; font: 800 54px/1.0 var(--display); text-transform: uppercase; }
.compare p { margin: 0; font-size: 29px; line-height: 1.38; }
.compare > div.hi { background: var(--ink); color: var(--paper); }
.compare > div.hi .tag { color: var(--rule); }

.bars { display: flex; align-items: end; gap: 14px; height: 260px; flex: none; }
.bars div { flex: 1; background: var(--ink); color: var(--paper); border-radius: 4px 4px 0 0; padding: 16px 20px; font: 500 24px/1.3 var(--mono); display: flex; flex-direction: column; justify-content: end; }
.bars div strong { font: 800 64px/1 var(--display); }
.bars div:last-child { background: var(--accent); color: var(--accent-ink); }

/* Draft gauge: hull draft marks against the old and new berth depth. */
.gauge { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 0 28px; height: 370px; flex: none; }
.gauge .scale { position: relative; border-right: 3px solid var(--ink); }
.gauge .scale span { position: absolute; right: 12px; font: 800 34px/1 var(--display); transform: translateY(-50%); }
.gauge .col { position: relative; border-bottom: 3px solid var(--ink);
  background: repeating-linear-gradient(180deg, transparent 0 29px, var(--rule) 29px 30px); }
.gauge .fill { position: absolute; left: 0; right: 0; top: 0; background: var(--ink); color: var(--paper);
  display: flex; flex-direction: column; justify-content: end; padding: 20px 24px; font: 500 24px/1.3 var(--mono); }
.gauge .fill strong { font: 800 72px/1 var(--display); }
.gauge .col.new .fill { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Port Calloway reopens its rebuilt harbor</h1>
      <p>Six cards from the Calloway Ledger article by Mira Okafor, 6 March 2026.</p>
    </div>
    <button class="primary" id="save-all" type="button">Download all PNGs</button>
  </header>

  <div class="gallery">

    <figure><div class="frame"><article class="card" data-name="01-cover">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Harbor reopened · 4 March 2026</div>
        <h2>A rebuilt harbor and <em>620 jobs</em> to come</h2>
        <p class="lede">Port Calloway reopened to cargo ships after a 19-month rebuild. It can now take the deep-draft ships that used to stay away.</p>
        <div class="stats">
          <div class="stat"><span class="n">620</span><span class="l">permanent jobs at full traffic, up from 410</span></div>
          <div class="stat"><span class="n">14 m</span><span class="l">draft at all three berths, up from 9 m</span></div>
          <div class="stat"><span class="n">6</span><span class="l">electric cranes replace 4 diesel ones</span></div>
          <div class="stat"><span class="n">19</span><span class="l">months closed for the rebuild</span></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>01 / 06</b></div>
    </article></div><figcaption><span>01 · Cover</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="02-jobs">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Jobs</div>
        <h2>210 more <em>permanent jobs</em></h2>
        <div class="bars">
          <div style="height:66%"><strong>410</strong>before the closure</div>
          <div style="height:100%"><strong>620</strong>at full traffic</div>
        </div>
        <ul class="pts">
          <li><b>Built locally.</b> The rebuild employed 1,850 people at its peak, most from Calloway County.</li>
          <li><b>Fishing kept its place.</b> The fleet moved to its own north basin with 48 berths, eight more than before.</li>
        </ul>
        <p class="quote">We were braced for losing space, and we gained it.</p>
        <div class="who">Ana Sorell, Calloway Fishermen's Association</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>02 / 06</b></div>
    </article></div><figcaption><span>02 · Jobs</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="03-draft">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Berths and draft</div>
        <h2>Deep enough for <em>modern box ships</em></h2>
        <p class="lede">The old 9 m limit kept most modern container ships away. Every new berth takes 14 m.</p>
        <div class="gauge">
          <div class="scale">
            <span style="top:0%">0</span>
            <span style="top:35.7%">5</span>
            <span style="top:64.3%">9</span>
            <span style="top:100%">14</span>
          </div>
          <div class="col"><div class="fill" style="height:64.3%"><strong>9 m</strong>deepest old berth</div></div>
          <div class="col new"><div class="fill" style="height:100%"><strong>14 m</strong>every new berth</div></div>
        </div>
        <div class="compare">
          <div><span class="tag">Before</span><h3>2 berths</h3><p>Both built in 1971.</p></div>
          <div class="hi"><span class="tag">Now</span><h3>3 berths</h3><p>All three take ships drawing 14 m.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>03 / 06</b></div>
    </article></div><figcaption><span>03 · Draft</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="04-cranes">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Cranes and shore power</div>
        <h2>Diesel out, <em>electric in</em></h2>
        <ul class="pts big">
          <li><b>Six electric cranes.</b> They replace the four diesel cranes that worked the old quay.</li>
          <li><b>38% lower emissions.</b> That's the harbor master's figure for the port's direct emissions.</li>
          <li><b>Shore power.</b> Ships can plug in at two of the three berths instead of running their engines while they unload.</li>
        </ul>
        <div class="spacer"></div>
        <p class="quote big">The cranes were our biggest single source.</p>
        <div class="who">Tomas Lindqvist, harbor master</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>04 / 06</b></div>
    </article></div><figcaption><span>04 · Cranes</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="05-cost">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Cost and schedule</div>
        <h2>Under budget, despite <em>a storm</em></h2>
        <ol class="tl">
          <li><span class="d">2024</span><span class="t">Town council approves the rebuild budget.</span></li>
          <li><span class="d">Nov 2025</span><span class="t">A storm floods the new quay wall and pushes the opening back six weeks.</span></li>
          <li><span class="d">4 Mar 2026</span><span class="t">The harbor reopens to cargo ships, 19 months after closing.</span></li>
        </ol>
        <div class="compare one">
          <div class="hi"><span class="tag">Final cost</span><h3>$412M, $38M under budget</h3><p>Contractor Rennick Marine absorbed the storm repairs under its contract, so the delay didn't raise the town's price.</p></div>
        </div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>05 / 06</b></div>
    </article></div><figcaption><span>05 · Cost</span><button type="button" class="save">Save PNG</button></figcaption></figure>

    <figure><div class="frame"><article class="card" data-name="06-traffic">
      <div class="card-top"><span>Port Calloway · Notice</span><span class="draft">14M</span></div>
      <div class="card-body">
        <div class="eyebrow">Traffic outlook</div>
        <h2>From 140 calls to <em>300 a year</em></h2>
        <div class="bars">
          <div style="height:47%"><strong>140</strong>ship calls, year one</div>
          <div style="height:100%"><strong>300</strong>a year by 2030</div>
        </div>
        <p class="lede">The council will publish monthly traffic figures, so residents can track whether those numbers hold.</p>
        <div class="spacer"></div>
        <p class="quote">The most important day for this town's economy in fifty years.</p>
        <div class="who">Mayor Delphine Achebe</div>
      </div>
      <div class="card-foot"><span>Source: Calloway Ledger, 6 Mar 2026</span><b>06 / 06</b></div>
    </article></div><figcaption><span>06 · Traffic</span><button type="button" class="save">Save PNG</button></figcaption></figure>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const s = Math.min(1, f.parentElement.clientWidth / 1080);
    f.style.width = 1080 * s + 'px';
    f.style.height = 1350 * s + 'px';
    f.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit();
addEventListener('resize', fit);

async function save(card) {
  await document.fonts.ready;
  const url = await htmlToImage.toPng(card, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: 'none' } });
  const a = document.createElement('a');
  a.download = card.dataset.name + '.png';
  a.href = url;
  a.click();
}

async function run(btn, cards) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    for (const c of cards) await save(c);
    btn.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    btn.textContent = 'Export failed, take a screenshot';
  }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
}

document.querySelectorAll('.save').forEach(btn =>
  btn.addEventListener('click', () => run(btn, [btn.closest('figure').querySelector('.card')])));
document.getElementById('save-all').addEventListener('click', e =>
  run(e.currentTarget, [...document.querySelectorAll('.card')]));
</script>
</body>
</html>
