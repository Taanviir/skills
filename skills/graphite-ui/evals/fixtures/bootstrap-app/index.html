<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Rota</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="custom.css">
</head>
<body>
<nav class="navbar navbar-expand bg-primary navbar-dark px-3">
  <span class="navbar-brand">Clinic Rota</span>
  <button class="btn btn-outline-light btn-sm ms-auto" id="theme">Toggle theme</button>
</nav>
<div class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="h3 me-auto">This week's shifts</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add">Add shift</button>
  </div>
  <div class="alert alert-danger">Two night shifts have no nurse assigned.</div>
  <div class="row g-3 mb-4">
    <div class="col"><div class="card kpi"><div class="card-body"><div class="text-muted small">Shifts</div><div class="kpi-value">64</div></div></div></div>
    <div class="col"><div class="card kpi"><div class="card-body"><div class="text-muted small">Unfilled</div><div class="kpi-value text-danger">2</div></div></div></div>
  </div>
  <table class="table table-striped">
    <thead><tr><th>Day</th><th>Shift</th><th>Nurse</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Mon</td><td>Night</td><td>R. Haddad</td><td><span class="badge bg-success">Confirmed</span></td></tr>
      <tr><td>Tue</td><td>Night</td><td>Unassigned</td><td><span class="badge bg-danger">Open</span></td></tr>
      <tr><td>Wed</td><td>Day</td><td>L. Okonkwo</td><td><span class="badge bg-warning text-dark">Swap asked</span></td></tr>
    </tbody>
  </table>
</div>
<div class="modal fade" id="add" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5">Add shift</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <label class="form-label" for="day">Day</label>
      <select class="form-select" id="day"><option>Mon</option><option>Tue</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Save shift</button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('theme').addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.bsTheme = html.dataset.bsTheme === 'dark' ? 'light' : 'dark';
});
</script>
</body>
</html>
